services:
  app:
    container_name: lann
    image: lann
    deploy:
      resources:
        limits:
          cpus: '38.0'
    build:
      context: .
      args:
        UID: ${UID}
        GID: ${GID}
        USERNAME: ${USERNAME}
    volumes:
      - ./:/app/
    stdin_open: true
    tty: true