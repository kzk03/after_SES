services:
  app:
    container_name: kazoo-latest
    image: kazoo-latest
    deploy:
      resources:
        limits:
          cpus: '20.0'
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    build:
      context: .
      args:
        UID: ${UID}
        GID: ${GID}
        USERNAME: ${USERNAME}
    volumes:
      - ./:/app/
    stdin_open: true
    tty: true